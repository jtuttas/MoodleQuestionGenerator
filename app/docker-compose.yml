services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      DATABASE_URL: sqlite+aiosqlite:////data/questions.db
      # OPENAI_API_KEY: sk-...   # Iteration 2: uncomment and set key
    volumes:
      # Persist SQLite database outside the container
      - db-data:/data
      # Mount frontend so the backend can serve it as static files
      - ../frontend:/app/frontend:ro
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
  ollama-models:
